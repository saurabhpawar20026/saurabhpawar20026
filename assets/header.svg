<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" fill="none" font-family="'Segoe UI', 'Trebuchet MS', Ubuntu, sans-serif">
  <defs>
    <!-- backgrounds & gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a1f"/>
      <stop offset="50%" stop-color="#1a1038"/>
      <stop offset="100%" stop-color="#0b0a1f"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7c3aed" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e879f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

  <!-- glowing orbs (animated) -->
  <circle cx="880" cy="60" r="150" fill="url(#orb)">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="260" r="140" fill="url(#orb2)">
    <animate attributeName="opacity" values="0.7;0.35;0.7" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== LEFT: identity ===== -->
  <g transform="translate(60,70)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
      <!-- eyebrow -->
      <text x="2" y="0" font-family="'Cascadia Code','Fira Code',monospace" font-size="15" letter-spacing="4" fill="#a78bfa" font-weight="600">&lt;/&gt; SOFTWARE ENGINEER</text>
      <!-- name -->
      <text x="0" y="62" font-size="60" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)">Saurabh Gagde</text>
      <!-- subtitle -->
      <text x="2" y="98" font-size="19" fill="#c7d2fe" font-weight="500">Full Stack Developer &#160;&#8226;&#160; Data Analytics &#160;&#8226;&#160; Machine Learning</text>
    </g>
    <!-- terminal prompt line with blinking cursor -->
    <g transform="translate(2,128)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.5s" fill="freeze"/>
      <text font-family="'Cascadia Code','Fira Code',monospace" font-size="15" fill="#7dd3fc">$ <tspan fill="#e2e8f0">building intelligent, scalable systems</tspan></text>
      <rect x="328" y="-12" width="9" height="16" fill="#a855f7">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ===== RIGHT: glassmorphic terminal ===== -->
  <g transform="translate(650,78)">
    <rect width="300" height="150" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.2"/>
    <rect width="300" height="30" rx="14" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
    <circle cx="40" cy="15" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="15" r="5" fill="#27c93f"/>
    <!-- code lines (token bars) -->
    <g transform="translate(20,52)">
      <rect width="40" height="8" rx="4" fill="#c084fc"/>
      <rect x="48" width="70" height="8" rx="4" fill="#7dd3fc"/>
      <rect x="126" width="50" height="8" rx="4" fill="#86efac"/>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.8s" fill="freeze"/>
    </g>
    <g transform="translate(36,74)">
      <rect width="60" height="8" rx="4" fill="#7dd3fc"/>
      <rect x="68" width="100" height="8" rx="4" fill="#e2e8f0" opacity="0.5"/>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.0s" fill="freeze"/>
    </g>
    <g transform="translate(36,96)">
      <rect width="90" height="8" rx="4" fill="#fca5a5"/>
      <rect x="98" width="44" height="8" rx="4" fill="#c084fc"/>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.2s" fill="freeze"/>
    </g>
    <g transform="translate(20,118)">
      <rect width="55" height="8" rx="4" fill="#86efac"/>
      <rect x="84" y="-3" width="9" height="14" fill="#a855f7">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.4s" fill="freeze"/>
    </g>
  </g>

  <!-- animated bottom sweep -->
  <rect x="60" y="252" width="240" height="3" rx="1.5" fill="url(#sweep)">
    <animate attributeName="width" values="0;240" dur="1s" begin="0.4s" fill="freeze"/>
  </rect>
</svg>
