<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" fill="none" font-family="'Segoe UI', 'Trebuchet MS', system-ui, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140d2e"/>
      <stop offset="100%" stop-color="#0b0a1f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glass card -->
  <rect x="1" y="1" width="898" height="498" rx="20" fill="url(#card)" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="498" rx="20" fill="#ffffff" fill-opacity="0.02"/>
  <rect x="12" y="20" width="5" height="460" rx="2.5" fill="url(#edge)"/>
  <circle cx="800" cy="70" r="160" fill="url(#orb)"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>

    <!-- name -->
    <text x="48" y="74" font-size="44" font-weight="800" fill="url(#name)" filter="url(#glow)">Saurabh Gagde</text>
    <rect x="50" y="90" width="170" height="3" rx="1.5" fill="url(#name)"/>

    <!-- education -->
    <text x="48" y="138" font-size="20"><tspan font-weight="700" fill="#a78bfa">🎓 Education&#160;&#160;</tspan><tspan font-weight="600" fill="#e2e8f0">Master of Computer Applications (MCA)</tspan></text>

    <!-- role -->
    <text x="48" y="176" font-size="20"><tspan font-weight="700" fill="#a78bfa">💼 Role&#160;&#160;</tspan><tspan font-weight="600" fill="#e2e8f0">Full Stack Developer &#8226; Data Analyst &#8226; ML Enthusiast</tspan></text>

    <!-- based -->
    <text x="48" y="214" font-size="20"><tspan font-weight="700" fill="#a78bfa">📍 Based in&#160;&#160;</tspan><tspan font-weight="600" fill="#e2e8f0">India</tspan></text>

    <!-- focus -->
    <text x="48" y="262" font-size="20" font-weight="700" fill="#a78bfa">🎯 Focus</text>
    <text x="72" y="294" font-size="18" font-weight="600" fill="#cbd5e1"><tspan fill="#a855f7" font-weight="800">▹ </tspan>Building scalable, end-to-end web applications</text>
    <text x="72" y="324" font-size="18" font-weight="600" fill="#cbd5e1"><tspan fill="#a855f7" font-weight="800">▹ </tspan>Turning raw data into actionable insights &amp; dashboards</text>
    <text x="72" y="354" font-size="18" font-weight="600" fill="#cbd5e1"><tspan fill="#a855f7" font-weight="800">▹ </tspan>Designing intelligent, AI-driven systems</text>

    <!-- currently learning -->
    <text x="48" y="402" font-size="20" font-weight="700" fill="#a78bfa">📚 Currently Learning</text>
    <g font-size="15" font-weight="700">
      <rect x="50" y="416" width="218" height="30" rx="15" fill="#a855f7" fill-opacity="0.16" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="159" y="436" text-anchor="middle" fill="#e9d5ff">Advanced System Design</text>
      <rect x="280" y="416" width="92" height="30" rx="15" fill="#6366f1" fill-opacity="0.16" stroke="#6366f1" stroke-opacity="0.5"/>
      <text x="326" y="436" text-anchor="middle" fill="#c7d2fe">MLOps</text>
      <rect x="384" y="416" width="186" height="30" rx="15" fill="#a855f7" fill-opacity="0.16" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="477" y="436" text-anchor="middle" fill="#e9d5ff">Cloud Architecture</text>
    </g>

    <!-- mantra -->
    <text x="48" y="484" font-size="17" font-style="italic" font-weight="600" fill="#94a3b8">💬 &#8220;Consistent coding is the key to becoming a 1% developer.&#8221;</text>
  </g>
</svg>
